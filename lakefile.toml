name = "RequestProject"
defaultTargets = ["RequestProject", "Codex888", "Codex888Tests", "codex888_demo"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.28.0"

[[lean_lib]]
name = "RequestProject"
globs = ["RequestProject.+"]

[[lean_lib]]
name = "Codex888"
leanOptions = { autoImplicit = false, warningAsError = true }

[[lean_lib]]
name = "Codex888Tests"
leanOptions = { autoImplicit = false, warningAsError = true }

[[lean_exe]]
name = "codex888_demo"
root = "Main"
leanOptions = { autoImplicit = false, warningAsError = true }
