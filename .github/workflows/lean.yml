name: Lean

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1
        with:
          auto-config: false
          build: true
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: true
      - name: Audit finite-core axioms
        run: lake env lean -DwarningAsError=true Audit.lean
      - name: Verify audit rejects forbidden proof dependencies
        run: python3 scripts/test_axiom_audit.py
      - name: Run the finite demonstration
        run: lake exe codex888_demo
      - name: Record successful verification
        run: |
          git diff --exit-code -- lean-toolchain lakefile.toml lake-manifest.json
          {
            echo '## Codex-888 verification passed'
            echo "Commit: $GITHUB_SHA"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Toolchain: $(cat lean-toolchain)"
            echo 'Passed: lake build, finite-core axiom audit, audit regression test, finite demonstration.'
            echo 'Pinned toolchain and dependency manifest remained unchanged.'
          } >> "$GITHUB_STEP_SUMMARY"
